# ============================================================
# BLOQUE 1 - CONFIGURACION DE PYTEST
# ============================================================
[pytest]

# Carpeta donde viven las pruebas.
testpaths = tests

# Modo estricto: las pruebas async deben marcarse de forma explicita.
asyncio_mode = strict

# Alcance del event loop de los fixtures async. Se fija de forma
# explicita para evitar cambios de comportamiento al actualizar.
asyncio_default_fixture_loop_scope = function